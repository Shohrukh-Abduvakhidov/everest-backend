#        restart: unless-stopped
#        env_file: .env
#        environment: { DB_HOST: db }
#        command: ["npm", "run", "worker:imports"]
#        depends_on: { backend: { condition: service_healthy } }
#    and the same for worker-attempts with command ["npm", "run", "worker:attempts"], then run
