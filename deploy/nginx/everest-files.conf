# /etc/nginx/sites-available/everest-files  (symlink into sites-enabled)
# Public S3 endpoint for presigned URLs (S3_PUBLIC_ENDPOINT=https://files.example.test).
# Replace files.example.test with the real host. certbot --nginx adds TLS.
#
# Presigned signatures include the Host header, so it is passed through unchanged and the backend signs
# URLs for exactly this host. CORS is answered by SeaweedFS from the bucket rule written by
# `storage:configure`; nginx adds no CORS headers so they are not duplicated.

server {
    server_name files.example.test;

    # Multipart parts are STORAGE_PART_SIZE_BYTES (default 32 MiB). A 4 GiB video stays at
    # 32 MiB parts; only files above ~312 GiB would raise the part size, so 128m leaves room
    # for a larger STORAGE_PART_SIZE_BYTES (keep this above it).
    client_max_body_size 128m;

    location / {
        proxy_pass http://127.0.0.1:8333;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Seeking: pass Range/If-Range through; S3 answers 206 with Content-Range.
        proxy_set_header Range             $http_range;
        proxy_set_header If-Range          $http_if_range;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        # Stream part uploads and video bytes instead of spooling them to the shared disk.
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_max_temp_file_size 0;
        proxy_connect_timeout 30s;
        # A 32 MiB part on a slow line, or a paused player, may take minutes.
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
        client_body_timeout 900s;
        send_timeout 900s;
    }

    listen 80;
}
