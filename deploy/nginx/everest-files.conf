# /etc/nginx/sites-available/everest-files  (symlink into sites-enabled)
# Public S3 endpoint for presigned URLs (S3_PUBLIC_ENDPOINT=https://files.example.test).
# Replace files.example.test with the real host. certbot --nginx adds TLS.
#
# Presigned signatures include the Host header, so it is passed through unchanged and the backend signs
# URLs for exactly this host. CORS is answered by SeaweedFS from the bucket rule written by
# `storage:configure`; nginx adds no CORS headers so they are not duplicated.

server {
    server_name files.example.test;

    # Multipart parts are STORAGE_PART_SIZE_BYTES (default 32 MiB); single-request uploads are smaller.
    client_max_body_size 64m;

    location / {
        proxy_pass http://127.0.0.1:8333;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    listen 80;
}
