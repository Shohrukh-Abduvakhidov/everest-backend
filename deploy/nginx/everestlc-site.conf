# /etc/nginx/sites-available/everestlc-site  (symlink into sites-enabled)
# Apex and www of everestlc.tj. Until the landing is deployed the apex sends visitors to the student app
# and www goes to the apex. One certificate covers both names:
#   sudo certbot certonly --webroot -w /var/www/letsencrypt --cert-name everestlc.tj \
#     -d everestlc.tj -d www.everestlc.tj --deploy-hook "systemctl reload nginx"
# Uses the "everest" log format defined in everest-api.

server {
    listen 443 ssl;
    http2 on;
    server_name everestlc.tj;
    access_log /var/log/nginx/everestlc-site.access.log everest;
    ssl_certificate /etc/letsencrypt/live/everestlc.tj/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/everestlc.tj/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    return 301 https://app.everestlc.tj$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name www.everestlc.tj;
    access_log /var/log/nginx/everestlc-site.access.log everest;
    ssl_certificate /etc/letsencrypt/live/everestlc.tj/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/everestlc.tj/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    return 301 https://everestlc.tj$request_uri;
}

# Port 80: ACME challenges (webroot), everything else to https on the same host.
server {
    listen 80;
    server_name everestlc.tj www.everestlc.tj;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}
