# /etc/nginx/sites-available/everest-app  (symlink into sites-enabled)
# Student application host. Replace app.example.test with the real host (e.g. app.51-83-197-15.sslip.io,
# later app.everestlc.tj). certbot --nginx adds the listen 443 / ssl_certificate lines and the HTTP redirect.
#
# /api/v1/ goes straight to the backend (one proxy hop, real client IP via TRUST_PROXY, no Next body limit);
# everything else goes to the Next.js frontend. Cookies stay first-party on this host.

server {
    server_name app.example.test;

    client_max_body_size 512m;   # admin question-package uploads (QUESTION_IMPORT_MAX_UPLOAD_MB=256 plus headroom)

    # The client address is set from the socket, never appended to a client-supplied header.
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
    proxy_set_header Connection "";

    location /api/v1/ {
        proxy_pass http://127.0.0.1:4100;
        proxy_request_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_read_timeout 60s;
    }

    listen 80;
}
